# Production Pied Piper Configuration
# Optimized for production deployment with security and performance best practices

network:
  tcp_port: 4001
  quic_port: 4002
  enable_mdns: false  # Disable mDNS in production (only works on local networks)
  
  # ⚠️ CRITICAL: Bootstrap peers are required for network discovery!
  # Without bootstrap peers, nodes cannot find each other (mDNS is disabled).
  # 
  # Setup Instructions:
  # 1. Deploy 2-3 bootstrap nodes with static IPs/DNS
  # 2. Get their Peer IDs from logs: "Local peer ID: 12D3KooW..."
  # 3. Add them below in format: PEER_ID@/ip4/IP_ADDRESS/tcp/PORT
  # 
  # Example bootstrap peer formats:
  # - IPv4: 12D3KooWRBhw...@/ip4/203.0.113.10/tcp/4001
  # - IPv6: 12D3KooWRBhw...@/ip6/2001:db8::1/tcp/4001
  # - DNS:  12D3KooWRBhw...@/dns4/bootstrap.example.com/tcp/4001
  #
  # See docs/NETWORK_DISCOVERY.md for complete guide
  bootstrap_peers:
    # TODO: Add your production bootstrap peers here
    # - 12D3KooWRBhwfeP8p3FEj6txR6xZJfPDa1N3vFfN5cNNp5Xr1e4F@/ip4/203.0.113.10/tcp/4001
    # - 12D3KooWAnotherPeer@/dns4/bootstrap-backup.example.com/tcp/4001
    []
  
  topics:
    - pied-piper-prod
  max_connections: 500
  idle_timeout_secs: 120

gateway:
  port: 8080
  https_port: 8443
  tls_cert_path: /etc/pied-piper/tls/cert.pem
  tls_key_path: /etc/pied-piper/tls/key.pem
  index_file: index.html
  enable_compression: true
  request_timeout_secs: 60

storage:
  data_dir: /var/lib/pied-piper
  cache_dir: /var/cache/pied-piper/modules
  dht_dir: /var/lib/pied-piper/dht
  max_cache_size_bytes: 2147483648  # 2 GB
  max_cache_entries: 1000

performance:
  worker_threads: 0  # Auto-detect
  connection_pool_size: 20
  pool_timeout_secs: 120
  tcp_keepalive: true
  wasm_fuel_limit: 500000000
  wasm_memory_limit_bytes: 134217728  # 128 MB

logging:
  level: info
  json_format: true  # Enable JSON logs for production log aggregation
  file_path: /var/log/pied-piper/gateway.log
