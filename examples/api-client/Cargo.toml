[package]
name = "api-client"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "api-client"
path = "src/main.rs"

[dependencies]
wit-bindgen = { version = "0.41", default-features = false, features = ["macros"] }
wit-bindgen-rt = "0.41"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0" }

[profile.release]
opt-level = "s"
lto = true
strip = true

[package.metadata.component]
package = "component:api-client"

[package.metadata.component.target]
path = "wit"
