<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pied Piper Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        header {
            background: rgba(255, 255, 255, 0.95);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            margin-bottom: 30px;
        }

        h1 {
            color: #667eea;
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #666;
            font-size: 1.1em;
        }

        .controls {
            background: rgba(255, 255, 255, 0.95);
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            margin-bottom: 30px;
        }

        .control-group {
            display: flex;
            gap: 15px;
            align-items: center;
            flex-wrap: wrap;
        }

        input[type="text"] {
            flex: 1;
            min-width: 300px;
            padding: 12px 20px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: #667eea;
        }

        button {
            padding: 12px 30px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        .modules-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 25px;
            margin-bottom: 30px;
        }

        .module-card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .module-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.3);
        }

        .module-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: 15px;
        }

        .module-name {
            font-size: 1.5em;
            font-weight: bold;
            color: #333;
        }

        .module-status {
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.85em;
            font-weight: 600;
        }

        .status-active {
            background: #d4edda;
            color: #155724;
        }

        .module-cid {
            font-family: 'Courier New', monospace;
            font-size: 0.85em;
            color: #666;
            background: #f5f5f5;
            padding: 8px 12px;
            border-radius: 8px;
            margin: 10px 0;
            word-break: break-all;
        }

        .endpoints {
            margin-top: 15px;
        }

        .endpoint-item {
            background: #f8f9fa;
            padding: 12px;
            margin: 8px 0;
            border-radius: 8px;
            border-left: 4px solid #667eea;
        }

        .endpoint-method {
            display: inline-block;
            padding: 3px 8px;
            background: #667eea;
            color: white;
            border-radius: 5px;
            font-size: 0.8em;
            font-weight: bold;
            margin-right: 8px;
        }

        .endpoint-path {
            font-family: 'Courier New', monospace;
            color: #333;
        }

        .endpoint-desc {
            font-size: 0.9em;
            color: #666;
            margin-top: 5px;
        }

        .action-buttons {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        .btn-test {
            flex: 1;
            padding: 10px;
            background: #28a745;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
        }

        .btn-test:hover {
            background: #218838;
        }

        .response-area {
            margin-top: 30px;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        .response-header {
            font-size: 1.3em;
            font-weight: bold;
            margin-bottom: 15px;
            color: #333;
        }

        .response-content {
            background: #1e1e1e;
            color: #d4d4d4;
            padding: 20px;
            border-radius: 10px;
            font-family: 'Courier New', monospace;
            font-size: 0.9em;
            overflow-x: auto;
            max-height: 400px;
            overflow-y: auto;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: white;
            font-size: 1.2em;
        }

        .error {
            background: #f8d7da;
            color: #721c24;
            padding: 15px;
            border-radius: 10px;
            margin: 10px 0;
        }

        .empty-state {
            text-align: center;
            padding: 60px;
            color: white;
        }

        .empty-state h2 {
            font-size: 2em;
            margin-bottom: 10px;
        }

        .stats {
            display: flex;
            gap: 20px;
            margin-top: 20px;
        }

        .stat-card {
            flex: 1;
            background: rgba(255, 255, 255, 0.1);
            padding: 20px;
            border-radius: 10px;
            color: white;
            text-align: center;
        }

        .stat-number {
            font-size: 2.5em;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .stat-label {
            font-size: 0.9em;
            opacity: 0.9;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🎭 Pied Piper Dashboard</h1>
            <p class="subtitle">Decentralized Application Platform</p>
            <div class="stats">
                <div class="stat-card">
                    <div class="stat-number" id="moduleCount">0</div>
                    <div class="stat-label">Active Modules</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number" id="endpointCount">0</div>
                    <div class="stat-label">Total Endpoints</div>
                </div>
            </div>
        </header>

        <div class="controls">
            <div class="control-group">
                <input type="text" id="cidInput" placeholder="Enter module CID to add manually...">
                <button onclick="addModuleByCid()">Add Module</button>
                <button onclick="discoverModules()">🔄 Refresh Modules</button>
            </div>
        </div>

        <div id="modulesContainer" class="modules-grid"></div>

        <div id="responseArea" class="response-area" style="display: none;">
            <div class="response-header">Response</div>
            <div class="response-content" id="responseContent"></div>
        </div>
    </div>

    <script>
        // Known modules (can be discovered or manually added)
        let modules = [];

        // Initialize dashboard
        document.addEventListener('DOMContentLoaded', () => {
            discoverModules();
        });

        async function discoverModules() {
            // Try to discover known modules
            const knownCids = [
                'b6mvygz2yetlnjhmgsilzkoucbkrupoamjnhuwyn2p3usgck23wvq', // hello-api
                'bmjncyyz5pox4zbfwajqib35znicam5q45cxvq4wdvrppd3gv2fra'  // joke-api
            ];

            modules = [];
            
            for (const cid of knownCids) {
                try {
                    const info = await fetchModuleInfo(cid);
                    if (info) {
                        modules.push({ cid, ...info });
                    }
                } catch (e) {
                    console.log(`Module ${cid} not available:`, e);
                }
            }

            renderModules();
        }

        async function addModuleByCid() {
            const cid = document.getElementById('cidInput').value.trim();
            if (!cid) {
                alert('Please enter a CID');
                return;
            }

            try {
                const info = await fetchModuleInfo(cid);
                if (info) {
                    modules.push({ cid, ...info });
                    renderModules();
                    document.getElementById('cidInput').value = '';
                }
            } catch (e) {
                alert('Failed to fetch module info: ' + e.message);
            }
        }

        async function fetchModuleInfo(cid) {
            const response = await fetch(`/cid/${cid}/api/info`);
            if (!response.ok) throw new Error('Module not available');
            return await response.json();
        }

        function renderModules() {
            const container = document.getElementById('modulesContainer');
            
            if (modules.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <h2>No Modules Found</h2>
                        <p>Add modules using their CID or deploy new ones</p>
                    </div>
                `;
                updateStats(0, 0);
                return;
            }

            let totalEndpoints = 0;
            
            container.innerHTML = modules.map(module => {
                const endpoints = module.endpoints || [];
                totalEndpoints += endpoints.length;
                
                return `
                    <div class="module-card">
                        <div class="module-header">
                            <div class="module-name">${module.name || 'Unknown'}</div>
                            <div class="module-status status-active">Active</div>
                        </div>
                        <div class="module-cid">${module.cid}</div>
                        <p style="color: #666; margin: 10px 0;">${module.description || 'No description'}</p>
                        
                        <div class="endpoints">
                            <strong>Endpoints:</strong>
                            ${endpoints.map(ep => `
                                <div class="endpoint-item">
                                    <div>
                                        <span class="endpoint-method">${ep.method}</span>
                                        <span class="endpoint-path">${ep.path}</span>
                                    </div>
                                    ${ep.description ? `<div class="endpoint-desc">${ep.description}</div>` : ''}
                                    <div class="action-buttons">
                                        <button class="btn-test" onclick="testEndpoint('${module.cid}', '${ep.path}', '${ep.method}')">
                                            Test API
                                        </button>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
            }).join('');

            updateStats(modules.length, totalEndpoints);
        }

        function updateStats(moduleCount, endpointCount) {
            document.getElementById('moduleCount').textContent = moduleCount;
            document.getElementById('endpointCount').textContent = endpointCount;
        }

        async function testEndpoint(cid, path, method) {
            const responseArea = document.getElementById('responseArea');
            const responseContent = document.getElementById('responseContent');
            
            responseArea.style.display = 'block';
            responseContent.textContent = 'Loading...';
            
            try {
                const url = `/cid/${cid}${path}`;
                const response = await fetch(url, { method });
                const data = await response.json();
                
                responseContent.textContent = JSON.stringify(data, null, 2);
            } catch (e) {
                responseContent.textContent = `Error: ${e.message}`;
            }
        }
    </script>
</body>
</html>
