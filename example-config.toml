[network]
tcp_port = 4001
quic_port = 4002
enable_mdns = true
bootstrap_peers = ["12D3KooWExamplePeer@/ip4/203.0.113.1/tcp/4001"]
topics = ["pied-piper"]
max_connections = 100
idle_timeout_secs = 60

[gateway]
port = 8080
https_port = 8443
tls_cert_path = "/path/to/cert.pem"
tls_key_path = "/path/to/key.pem"
index_file = "index.html"
enable_compression = true
request_timeout_secs = 30

[storage]
data_dir = ".pied-piper"
cache_dir = ".pied-piper/modules"
dht_dir = ".pied-piper"
max_cache_size_bytes = 536870912
max_cache_entries = 256

[performance]
worker_threads = 0
connection_pool_size = 10
pool_timeout_secs = 90
tcp_keepalive = true
wasm_fuel_limit = 100000000
wasm_memory_limit_bytes = 67108864

[logging]
level = "info"
json_format = false
