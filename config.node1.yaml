# Pied Piper Node 1 Configuration
# Connects to bootstrap node at 172.20.0.10

network:
  tcp_port: 4001
  quic_port: 4002
  enable_mdns: true
  # Bootstrap peer will be auto-discovered via mDNS in Docker network
  bootstrap_peers: []
  topics:
    - pied-piper
  max_connections: 100
  idle_timeout_secs: 60

gateway:
  port: 8080
  https_port: 0
  tls_cert_path: null
  tls_key_path: null
  index_file: index.html
  enable_compression: true
  request_timeout_secs: 30

storage:
  data_dir: /home/pied-piper/.pied-piper
  cache_dir: null
  dht_dir: null
  max_cache_size_bytes: 536870912
  max_cache_entries: 256

performance:
  worker_threads: 0
  connection_pool_size: 10
  pool_timeout_secs: 90
  tcp_keepalive: true
  wasm_fuel_limit: 100000000
  wasm_memory_limit_bytes: 67108864

logging:
  level: info
  json_format: false
  file_path: null
