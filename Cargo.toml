[package]
name = "pied-piper"
version = "0.2.0"
edition = "2024"

[dependencies]
anyhow = "1.0.100"
async-trait = "0.1.89"
axum = "0.7.9"
blake3 = "1.8.2"
clap = { version = "4.5.53", features = ["derive"] }
futures = "0.3.31"
libp2p = { version = "0.56.0", features = ["tokio", "tcp", "quic", "noise", "yamux", "gossipsub", "kad", "mdns", "identify", "macros", "ping", "request-response", "cbor", "json"] }
multibase = "0.9.2"
multihash = "0.19.3"
rand = "0.9.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }
urlencoding = "2.1.3"
wasmtime = { version = "39.0.1", features = ["async", "cranelift"] }
wasmtime-wasi = { version = "39.0.1", features = ["p3"] }

[dev-dependencies]
rand = "0.9.2"
tempfile = "3.23.0"
