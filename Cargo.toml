[package]
name = "pied-piper"
version = "0.5.0"
edition = "2024"

[dependencies]
anyhow = "1.0.100"
async-trait = "0.1.89"
axum = { version = "0.7.9", features = ["ws"] }
axum-server = { version = "0.7.1", features = ["tls-rustls"] }
base64 = "0.22"
bincode = "1.3.3"
blake3 = "1.8.2"
chrono = "0.4"
clap = { version = "4.5.53", features = ["derive"] }
dirs = "5.0.1"
futures = "0.3.31"
hyper = { version = "1.5.2", features = ["server", "http1"] }
hyper-util = { version = "0.1.10", features = ["tokio"] }
libp2p = { version = "0.56.0", features = ["tokio", "tcp", "quic", "noise", "yamux", "gossipsub", "kad", "mdns", "identify", "macros", "ping", "request-response", "cbor", "json", "relay", "dcutr"] }
lru = "0.12.5"
multibase = "0.9.2"
multihash = "0.19.3"
prometheus = "0.13.4"
rand = "0.9.2"
reqwest = { version = "0.12", features = ["json"] }
rustls = "0.23.19"
rustls-pemfile = "2.2.0"
semver = "1.0.23"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
serde_yaml = "0.9.34"
tar = "0.4.44"
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = ["full"] }
tokio-rustls = "0.26.1"
tokio-tungstenite = "0.24.0"
tower = "0.5.2"
tower-http = { version = "0.6.2", features = ["compression-full", "decompression-full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }
urlencoding = "2.1.3"
wasmtime = { version = "39.0.1", features = ["async", "cranelift", "component-model"] }
wasmtime-wasi = { version = "39.0.1", features = ["p1", "p2"] }

[dev-dependencies]
rand = "0.9.2"
tempfile = "3.23.0"
