version: '3.8'

services:
  # Bootstrap node - first node in the network
  node-bootstrap:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pied-piper-bootstrap
    hostname: bootstrap
    environment:
      - RUST_LOG=info
      - NODE_NAME=bootstrap
    ports:
      - "8080:8080"    # HTTP Gateway
      - "4001:4001"    # libp2p TCP
      - "4002:4002/udp" # libp2p QUIC
    volumes:
      - bootstrap-data:/home/pied-piper/.pied-piper
      - ./config.bootstrap.yaml:/home/pied-piper/config.yaml:ro
    networks:
      pied-piper-network:
        ipv4_address: 172.20.0.10
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  # Node 1
  node-1:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pied-piper-node-1
    hostname: node-1
    environment:
      - RUST_LOG=info
      - NODE_NAME=node-1
      - BOOTSTRAP_NODE=/ip4/172.20.0.10/tcp/4001/p2p/BOOTSTRAP_PEER_ID
    ports:
      - "8081:8080"    # HTTP Gateway
      - "4011:4001"    # libp2p TCP
      - "4012:4002/udp" # libp2p QUIC
    volumes:
      - node-1-data:/home/pied-piper/.pied-piper
      - ./config.node1.yaml:/home/pied-piper/config.yaml:ro
    networks:
      pied-piper-network:
        ipv4_address: 172.20.0.11
    depends_on:
      node-bootstrap:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  # Node 2
  node-2:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pied-piper-node-2
    hostname: node-2
    environment:
      - RUST_LOG=info
      - NODE_NAME=node-2
      - BOOTSTRAP_NODE=/ip4/172.20.0.10/tcp/4001/p2p/BOOTSTRAP_PEER_ID
    ports:
      - "8082:8080"    # HTTP Gateway
      - "4021:4001"    # libp2p TCP
      - "4022:4002/udp" # libp2p QUIC
    volumes:
      - node-2-data:/home/pied-piper/.pied-piper
      - ./config.node2.yaml:/home/pied-piper/config.yaml:ro
    networks:
      pied-piper-network:
        ipv4_address: 172.20.0.12
    depends_on:
      node-bootstrap:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  # Node 3
  node-3:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pied-piper-node-3
    hostname: node-3
    environment:
      - RUST_LOG=info
      - NODE_NAME=node-3
      - BOOTSTRAP_NODE=/ip4/172.20.0.10/tcp/4001/p2p/BOOTSTRAP_PEER_ID
    ports:
      - "8083:8080"    # HTTP Gateway
      - "4031:4001"    # libp2p TCP
      - "4032:4002/udp" # libp2p QUIC
    volumes:
      - node-3-data:/home/pied-piper/.pied-piper
      - ./config.node3.yaml:/home/pied-piper/config.yaml:ro
    networks:
      pied-piper-network:
        ipv4_address: 172.20.0.13
    depends_on:
      node-bootstrap:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped

networks:
  pied-piper-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/24

volumes:
  bootstrap-data:
  node-1-data:
  node-2-data:
  node-3-data:
